spring.application.name=minero-yachaq-api
server.port=${PORT:8080}
server.address=0.0.0.0
# TiDB Cloud Starter (compatible con MySQL). Use variables de entorno en Render.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Primer arranque: update crea las tablas. Despues de crear el esquema, cambiar a validate.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=25000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=900000
# Obligatoria en la nube: minimo 32 caracteres aleatorios.
yachaq.auth.secret=${YACHAQ_TOKEN_SECRET}
yachaq.auth.expiration-seconds=86400
